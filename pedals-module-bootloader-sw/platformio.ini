[platformio]
src_dir = Core/Src
include_dir = Core/Inc

[env]
platform = ststm32
upload_protocol = stlink
monitor_speed = 115200

board = disco_f334c8
board_build.ldscript = STM32C092XX_FLASH.ld

build_src_filter =

[env:release]
build_flags = 
    -DUSE_HAL_DRIVER
    -DSTM32C092xx
    -ICore/Inc
	-ICore/Inc/pedals
    -IDrivers/CMSIS/Include
    -IDrivers/STM32C0xx_HAL_Driver/Inc
    -IDrivers/STM32C0xx_HAL_Driver/Inc/Legacy
    -IDrivers/CMSIS/Device/ST/STM32C0xx/Include
	-Wall 
    -Wextra 
    -Wpedantic 
    -Werror

[env:simple-check] # to see if it compiles despite warning errors of type "unused" 
build_flags = 
	-DUSE_HAL_DRIVER
    -DSTM32C092xx
    -ICore/Inc
	-ICore/Inc/pedals
    -IDrivers/CMSIS/Include
    -IDrivers/STM32C0xx_HAL_Driver/Inc
    -IDrivers/STM32C0xx_HAL_Driver/Inc/Legacy
    -IDrivers/CMSIS/Device/ST/STM32C0xx/Include
