[platformio]
src_dir = .
include_dir = .
default_envs = release

[env:release]
platform = ststm32
platform_packages =
  toolchain-gccarmnoneeabi@=1.140201.0
monitor_speed = 115200

board = genericSTM32C092xC
board_build.ldscript = STM32C092XX_FLASH.ld

;   mode=Normal : hotplug connect (no NRST needed).
;   mode=UR     : connect under reset (needs NRST wired) - use this if a
;                 Normal connect fails or to recover a misbehaving target.
upload_protocol = custom
upload_command = STM32_Programmer_CLI -c port=SWD mode=Normal -d "$BUILD_DIR/firmware.elf" -v -rst

build_src_filter =
    +<Core/Src/>
    +<Drivers/STM32C0xx_HAL_Driver/Src/>
    -<Drivers/STM32C0xx_HAL_Driver/Src/*_template.c>
	+<Core/Src/pedals/>
    +<*.s>
build_flags = 
    -DUSE_HAL_DRIVER
	-std=gnu23
    -DSTM32C092xx
    -ICore/Inc
    -IDrivers/CMSIS/Include
    -IDrivers/STM32C0xx_HAL_Driver/Inc
    -IDrivers/STM32C0xx_HAL_Driver/Inc/Legacy
    -IDrivers/CMSIS/Device/ST/STM32C0xx/Include
	-ICore/Inc/pedals

lib_deps =
    https://github.com/eagletrt/libcan-sw.git
	https://github.com/eagletrt/libpal-sw.git#v0.1.0
