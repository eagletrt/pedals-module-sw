[platformio]
src_dir = .
include_dir = .
default_envs = release

[env:release]
platform = ststm32
upload_protocol = stlink
debug_tool = stlink
platform_packages =
  toolchain-gccarmnoneeabi@=1.140201.0
monitor_speed = 115200
extra_scripts = pre:scripts/build_script.py

board = disco_f334c8
board_build.ldscript = STM32C092XX_FLASH_SHIFTED.ld

build_src_filter =
    +<Core/Src/>
    +<Core/Src/pedals/>
    +<Drivers/STM32C0xx_HAL_Driver/Src/>
    -<Drivers/STM32C0xx_HAL_Driver/Src/*_template.c>
    +<*.s>
build_flags =
    -DUSE_HAL_DRIVER
	-std=gnu23
    -DSTM32C092xx
    -ICore/Inc
	-ICore/Inc/pedals
    -IDrivers/CMSIS/Include
    -IDrivers/STM32C0xx_HAL_Driver/Inc
    -IDrivers/STM32C0xx_HAL_Driver/Inc/Legacy
    -IDrivers/CMSIS/Device/ST/STM32C0xx/Include

lib_deps = https://github.com/eagletrt/libeagletrt-sw.git#v0.1.0

check_tool = clangtidy
check_flags =
    clangtidy: --checks=-*,cert-*,clang-analyzer-*,bugprone-*,performance-*,readability-*,-bugprone-easily-swappable-parameters
    clangtidy: --warnings-as-errors=clang-analyzer-*,bugprone-*
    clangtidy: --header-filter=^.*Core/(Inc|Src)/.+/[^/]+\.(c|h)$
    clangtidy: --system-headers=false
check_src_filters =
    -<**>
    +<Core/Src/pedals>
    +<Core/Inc/pedals>

[env:tests]
platform = native
test_framework = unity
test_build_src = true

lib_deps = https://github.com/eagletrt/libeagletrt-sw.git#v0.1.0

build_flags =
	-std=gnu23
	-ICore/Inc/pedals
	-Itest/include
	-DEAGLETRT_STATIC=
	-DEAGLETRT_STATIC_INLINE=

build_src_filter =
	-<**>
	+<Core/Src/pedals/>

